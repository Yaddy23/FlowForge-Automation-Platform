version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: flowforge-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=flowforge
      - MONGO_INITDB_ROOT_PASSWORD=flowforge123
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: flowforge-server
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development

  client:
    build: ./client
    container_name: flowforge-client
    ports:
      - "5173:5173"
    env_file:
      - ./client/.env
    depends_on:
      - server
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development

  worker:
    build: ./server
    container_name: flowforge-worker
    env_file:
      - ./server/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run worker

  # CI-friendly E2E runner:
  #   docker compose --profile e2e up --abort-on-container-exit e2e
  # Drives the same specs as `npm run test:e2e`, but against this compose stack
  # instead of the throwaway mongod + API + Vite that playwright.config.ts
  # starts on its own. E2E_MONGODB_URI is what opts global-setup into seeding
  # this stack's database.
  #
  # NOTE: unverified — Docker was not available in the environment this was
  # written in, and it needs the server/client Dockerfiles from Task 21. The
  # client service must also serve Vite on 0.0.0.0 (--host 0.0.0.0) rather than
  # its default `localhost`, or http://client:5173 is unreachable from here.
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    container_name: flowforge-e2e
    environment:
      - PLAYWRIGHT_BASE_URL=http://client:5173
      - PLAYWRIGHT_API_URL=http://server:3001
      - E2E_MONGODB_URI=mongodb://flowforge:flowforge123@mongo:27017/flowforge-e2e?authSource=admin
    depends_on:
      - server
      - client

volumes:
  mongo_data:
  redis_data: